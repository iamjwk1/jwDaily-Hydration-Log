name: Publish jwDaily Hydration Log v1.1.0-beta.2
on:
  push:
    branches: ["release/v1.1.0-beta.2"]
    paths:
      - .github/workflows/publish-beta-v1.1.0-beta.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jwdhl-release-v1.1.0-beta.2
  cancel-in-progress: false

jobs:
  publish-beta:
    name: Validate source and publish HACS prerelease
    if: github.repository == 'iamjwk1/jwDaily-Hydration-Log'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python compilation and backend regression tests
        run: |
          python -m compileall -q custom_components/jw_daily_hydration_log
          python tests/qa.py
      - name: JavaScript card interaction regression tests
        run: node tests/frontend_qa.js
      - name: Validate release metadata and assets
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('custom_components/jw_daily_hydration_log')
          manifest=json.loads((root/'manifest.json').read_text())
          constants=(root/'const.py').read_text()
          card=(root/'www/jwdaily-hydration-log-card.js').read_text()
          excel=(root/'excel.py').read_text()
          assert manifest['domain']=='jw_daily_hydration_log'
          assert manifest['version']=='1.1.0-beta.2'
          assert "VERSION = '1.1.0-beta.2'" in constants
          assert 'v1.1.0-beta.2' in card
          assert 'M38 ${targetY} L122 ${targetY}' in card and 'targetY=39' in card
          assert 'Liquid Types' in excel
          assert (root/'brand/icon.png').is_file()
          assert json.loads(pathlib.Path('hacs.json').read_text())['name']=='jwDaily Hydration Log'
          assert pathlib.Path('RELEASE_NOTES_v1.1.0-beta.2.md').is_file()
          print('BETA.2 METADATA AND GLASS TARGET: PASS')
          PY
      - uses: home-assistant/actions/hassfest@master
      - name: HACS repository validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Create official beta.2 GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0-beta.2 >/dev/null 2>&1; then
            echo 'Pre-release exists; keeping its original tag and contents unchanged.'
            gh release view v1.1.0-beta.2 --json tagName,isPrerelease,url
            exit 0
          fi
          gh release create v1.1.0-beta.2 --target "$GITHUB_SHA" --title 'jwDaily Hydration Log v1.1.0-beta.2' --prerelease --latest=false --notes-file RELEASE_NOTES_v1.1.0-beta.2.md
          gh release view v1.1.0-beta.2 --json tagName,isPrerelease,url
