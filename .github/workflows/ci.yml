name: Source QA
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax and legacy regression
        run: |
          python -m compileall -q custom_components/jw_daily_hydration_log
          python tests/qa.py
      - name: Beta29 storage, native migration, Data and Full Backup, Excel QA
        run: python tests/qa_beta29.py
      - name: Frontend syntax
        run: node --check custom_components/jw_daily_hydration_log/www/jwdaily-hydration-log-card.js
      - name: Real Chromium responsive and import/export dialogs
        run: |
          python -m pip install --disable-pip-version-check playwright
          python tests/browser_beta29.py
