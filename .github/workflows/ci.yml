name: Source QA
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q custom_components/jw_daily_hydration_log
      - name: Legacy backend offline regression
        run: python tests/qa.py
      - name: Beta24 storage, migration and OOXML regression
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          python tests/qa_beta24.py
      - name: Frontend syntax
        run: node --check custom_components/jw_daily_hydration_log/www/jwdaily-hydration-log-card.js
