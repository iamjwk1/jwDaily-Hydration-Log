name: Source QA
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q custom_components/jw_daily_hydration_log
      - name: Python offline tests
        run: python tests/qa.py
      - name: Frontend offline tests
        run: node tests/frontend_qa.js
