name: Source QA
on:
  push:
  pull_request:
jobs:
  native-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native storage, backup, Excel and quick deletion regression
        run: |
          python -m compileall -q custom_components/jw_daily_hydration_log
          python tests/qa_beta30.py
          python tests/qa_beta31.py
          python tests/migration_v3_preflight_qa.py
          python tests/migration_v3_storage_qa.py
          python tests/legacy_cleanup_v4_qa.py
          python tests/beta32_excel_contract_qa.py
          python tests/beta37_excel_units_qa.py
          python tests/beta46_excel_reference_qa.py
          python tests/beta47_excel_reference_style_qa.py
          python tests/beta48_excel_outline_icons_qa.py
          python tests/v1_5_0_profile_settings_excel_qa.py
          python tests/v1_5_1_beta_1_excel_yesno_autofit_qa.py
          python tests/v1_5_1_beta_2_profile_save_no_reload_qa.py
          python tests/v1_5_1_beta_4_restore_preview_qa.py
          python tests/v2_repo_layout_qa.py
          python tests/v2_0_1_excel_sheet_count_qa.py
          python tests/beta39_version_guard_qa.py
          python tests/beta40_restore_scope_qa.py
          python tests/beta43_data_timezone_qa.py
          python tests/add_drink_profile_display_qa.py
          node --check custom_components/jw_daily_hydration_log/www/jwdaily-hydration-log-card.js
      - name: Actual Chromium settings and Delete/Cancel regression
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/beta37_browser_qa.py

      - name: Preserve beta42 Chromium visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta43-chromium-ui-screenshots
          path: qa_screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
