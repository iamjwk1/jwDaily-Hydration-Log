name: Source QA
on:
  push:
  pull_request:
jobs:
  native-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full native storage, transfers and Excel regression
        run: |
          python -m compileall -q custom_components/jw_daily_hydration_log
          python tests/qa_beta30.py
          node --check custom_components/jw_daily_hydration_log/www/jwdaily-hydration-log-card.js
      - name: Actual Chromium history and settings regression
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/browser_beta30.py
