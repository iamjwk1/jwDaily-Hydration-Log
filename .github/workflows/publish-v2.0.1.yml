name: jwDaily Hydration Log v2.0.1 — verify and publish stable release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.0.1.yml'
      - 'custom_components/jw_daily_hydration_log/**'
      - 'docs/releases/v2.0.1.md'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jwdhl-v201-stable-release
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full historical storage, migration, workbook and source QA
        run: |
          python -m compileall -q custom_components/jw_daily_hydration_log
          python tests/qa_beta30.py
          python tests/qa_beta31.py
          python tests/migration_v3_preflight_qa.py
          python tests/migration_v3_storage_qa.py
          python tests/legacy_cleanup_v4_qa.py
          python tests/beta32_excel_contract_qa.py
          python tests/beta37_excel_units_qa.py
          python tests/beta46_excel_reference_qa.py
          python tests/beta47_excel_reference_style_qa.py
          python tests/beta48_excel_outline_icons_qa.py
          python tests/v1_5_0_profile_settings_excel_qa.py
          python tests/v1_5_1_beta_1_excel_yesno_autofit_qa.py
          python tests/v1_5_1_beta_2_profile_save_no_reload_qa.py
          python tests/v2_repo_layout_qa.py
          python tests/v2_0_1_excel_sheet_count_qa.py
          python tests/v1_5_1_beta_4_restore_preview_qa.py
          python tests/beta39_version_guard_qa.py
          python tests/beta40_restore_scope_qa.py
          python tests/beta43_data_timezone_qa.py
          python tests/add_drink_profile_display_qa.py
          node --check custom_components/jw_daily_hydration_log/www/jwdaily-hydration-log-card.js
      - name: Chromium settings and deletion regression
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/beta37_browser_qa.py
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    name: Hassfest integration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  publish:
    name: Publish verified stable v2.0.1 ZIP and SHA256
    needs: [native, hacs, hassfest]
    if: github.repository == 'iamjwk1/jwDaily-Hydration-Log' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify full HACS ZIP and checksum
        run: |
          python - <<'PY_ZIP'
          from pathlib import Path
          import hashlib,json,zipfile
          version='2.0.1'
          assert json.loads(Path('custom_components/jw_daily_hydration_log/manifest.json').read_text())['version']==version
          root=Path('custom_components/jw_daily_hydration_log')
          assert version in (root/'const.py').read_text()
          assert version in (root/'www/jwdaily-hydration-log-card.js').read_text()
          name='20261123 jwDaily Hydration Log v2.0.1.zip'
          required=['README.md','LICENSE','LICENSE-UPSTREAM-MIT','hacs.json',
                    'docs/USER_GUIDE.md','docs/RELEASE_NOTES.md','docs/CHANGELOG.md',
                    'docs/releases/v2.0.1.md','docs/examples/apexcharts.md']
          members=required + [p.as_posix() for p in root.rglob('*')
                    if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc']
          members=sorted(set(members))
          assert len(members)>=20,(len(members),members)
          with zipfile.ZipFile(name,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for member in members:
                  item=zipfile.ZipInfo(member,date_time=(2026,11,23,0,0,0))
                  item.compress_type=zipfile.ZIP_DEFLATED
                  item.external_attr=0o644<<16
                  out.writestr(item,Path(member).read_bytes())
          with zipfile.ZipFile(name) as verify:
              assert verify.testzip() is None
              assert verify.namelist()==members
              assert all(verify.read(p)==Path(p).read_bytes() for p in members)
          path=Path(name)
          assert path.stat().st_size>50000
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          Path(name+'.sha256').write_text(f'{digest}  {name}\n')
          print('RELEASE_ZIP_QA_PASS',name,path.stat().st_size,digest,'CRC_OK')
          PY_ZIP
      - name: Publish stable GitHub release without overwriting existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 'v2.0.1' >/dev/null 2>&1; then
            echo 'Existing stable v2.0.1 detected; no tag or assets will be overwritten.'
            exit 1
          fi
          gh release create 'v2.0.1' \
            --target "$GITHUB_SHA" \
            --title 'jwDaily Hydration Log v2.0.1' \
            --notes-file 'docs/releases/v2.0.1.md' \
            --latest \
            '20261123 jwDaily Hydration Log v2.0.1.zip' \
            '20261123 jwDaily Hydration Log v2.0.1.zip.sha256'
          gh release view 'v2.0.1' --json url,tagName,isPrerelease
          test "$(gh release view 'v2.0.1' --json isPrerelease --jq '.isPrerelease')" = 'false'
      - name: Retain verified stable ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v201-stable-verified-file-library
          path: '20261123 jwDaily Hydration Log v2.0.1.zip'
          if-no-files-found: error
          retention-days: 30
