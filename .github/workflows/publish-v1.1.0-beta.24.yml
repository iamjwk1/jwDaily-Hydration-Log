name: jwDaily Hydration Log beta.24 — validate and publish
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/jw_daily_hydration_log/**'
      - 'tests/qa_beta24.py'
      - 'tests/browser_beta24.py'
      - 'RELEASE_NOTES_v1.1.0-beta.24.md'
      - '.github/workflows/publish-v1.1.0-beta.24.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jwdhl-beta24-publish
  cancel-in-progress: false
jobs:
  source-and-excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy backend and beta24 storage, migration and Excel tests
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          python -m compileall -q custom_components/jw_daily_hydration_log
          python tests/qa.py
          python tests/qa_beta24.py
          node --check custom_components/jw_daily_hydration_log/www/jwdaily-hydration-log-card.js
      - name: Real Chromium responsive and interaction regression
        run: |
          python -m pip install --disable-pip-version-check playwright
          python tests/browser_beta24.py
  hacs:
    name: HACS integration validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    name: Hassfest integration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  publish:
    name: Publish verified v1.1.0-beta.24 prerelease
    needs: [source-and-excel, hacs, hassfest]
    if: github.repository == 'iamjwk1/jwDaily-Hydration-Log'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce and verify complete HACS installation ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          root=Path('.')
          assert json.loads((root/'custom_components/jw_daily_hydration_log/manifest.json').read_text())['version']=='1.1.0-beta.24'
          fname='20261111 jwDaily Hydration Log v1.1.0-beta.24.zip'
          files=['CHANGELOG.md','LICENSE','LICENSE-UPSTREAM-MIT','README.md','RELEASE_NOTES_v1.1.0-beta.24.md','hacs.json']
          files.extend(p.as_posix() for p in Path('custom_components/jw_daily_hydration_log').rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          files.extend(p.as_posix() for p in Path('examples').rglob('*') if p.is_file() and 'beta.24' in p.name)
          files=sorted(set(files))
          assert len(files)==22,(len(files),files)
          with zipfile.ZipFile(fname,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for name in files:
                  info=zipfile.ZipInfo(name,date_time=(2026,11,11,16,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  out.writestr(info,Path(name).read_bytes())
          with zipfile.ZipFile(fname) as archive:
              assert archive.testzip() is None
              assert archive.namelist()==files
              assert all(archive.read(name)==Path(name).read_bytes() for name in files)
          digest=hashlib.sha256(Path(fname).read_bytes()).hexdigest()
          Path(fname+'.sha256').write_text(f'{digest}  {fname}\n')
          print('RELEASE_ZIP_QA_PASS',fname,Path(fname).stat().st_size,digest)
          PY
      - name: Publish official GitHub prerelease only after all checks succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 'v1.1.0-beta.24' >/dev/null 2>&1; then
            echo 'beta.24 release already present; do not overwrite.'
            gh release view 'v1.1.0-beta.24' --json url,tagName,isPrerelease
            exit 0
          fi
          gh release create 'v1.1.0-beta.24' \
            --target "$GITHUB_SHA" \
            --title 'jwDaily Hydration Log v1.1.0-beta.24' \
            --notes-file 'RELEASE_NOTES_v1.1.0-beta.24.md' \
            --prerelease \
            '20261111 jwDaily Hydration Log v1.1.0-beta.24.zip' \
            '20261111 jwDaily Hydration Log v1.1.0-beta.24.zip.sha256'
          gh release view 'v1.1.0-beta.24' --json url,tagName,isPrerelease
